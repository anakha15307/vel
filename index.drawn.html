<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
<title>Vel</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; }
  svg { width: 100%; height: 100%; cursor: grab; }
  svg:active { cursor: grabbing; }
  #aura { transition: transform .5s ease-out; transform-origin: 120px 130px; }
  #aura.bless { transform: scale(1.6); }
</style>
</head>
<body>
<svg viewBox="0 0 240 340">
  <defs>
    <!-- Diagonal gold for flat faces -->
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe9a0"/>
      <stop offset=".5" stop-color="#e0a82e"/>
      <stop offset="1" stop-color="#8f5a0a"/>
    </linearGradient>
    <!-- Horizontal gold for turned, cylindrical parts (rings, bulb, shaft) -->
    <linearGradient id="goldH" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8f5a0a"/>
      <stop offset=".3" stop-color="#ffe9a0"/>
      <stop offset=".55" stop-color="#e0a82e"/>
      <stop offset="1" stop-color="#8f5a0a"/>
    </linearGradient>
    <!-- Vertical gold for the raised bars -->
    <linearGradient id="goldV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff0b8"/>
      <stop offset=".5" stop-color="#e5b13a"/>
      <stop offset="1" stop-color="#9a6410"/>
    </linearGradient>
    <radialGradient id="ruby" cx=".38" cy=".35" r=".75">
      <stop offset="0" stop-color="#ff8a8a"/>
      <stop offset=".45" stop-color="#d4122a"/>
      <stop offset="1" stop-color="#6b0414"/>
    </radialGradient>
    <radialGradient id="halo"><stop offset="0" stop-color="#ffd76a" stop-opacity=".9"/><stop offset="1" stop-color="#ffd76a" stop-opacity="0"/></radialGradient>
    <path id="blade" d="M0 -150 C10 -135 46 -95 46 -62 C46 -50 40 -44 30 -42 L-30 -42 C-40 -44 -46 -50 -46 -62 C-46 -95 -10 -135 0 -150 Z"/>
  </defs>
  <g id="aura"><circle id="glow" cx="120" cy="130" r="115" fill="url(#halo)"/></g>

  <!-- Vel, tip up, centered on x=120. Origin is the sway pivot (middle of the vel). -->
  <g id="vel" transform="translate(120 170)">
    <!-- Shaft: long rod, collar rings, bulb -->
    <rect x="-3.5" y="-10" width="7" height="142" fill="url(#goldH)"/>
    <path d="M0 150 L-6 134 L0 128 L6 134 Z" fill="url(#goldH)" stroke="#8f5a0a" stroke-width=".6"/>
    <ellipse cx="0" cy="62" rx="8" ry="3.2" fill="url(#goldH)" stroke="#8f5a0a" stroke-width=".5"/>
    <ellipse cx="0" cy="38" rx="12" ry="15" fill="url(#goldH)" stroke="#8f5a0a" stroke-width=".6"/>
    <ellipse cx="0" cy="38" rx="12" ry="3" fill="none" stroke="#8f5a0a" stroke-opacity=".45" stroke-width=".8"/>
    <ellipse cx="0" cy="20" rx="9" ry="3.4" fill="url(#goldH)" stroke="#8f5a0a" stroke-width=".5"/>
    <ellipse cx="0" cy="12" rx="7" ry="2.6" fill="url(#goldH)" stroke="#8f5a0a" stroke-width=".5"/>
    <!-- Neck flaring up into the lotus -->
    <path d="M-5 4 C-5 -4 -12 -10 -16 -16 L16 -16 C12 -10 5 -4 5 4 Z" fill="url(#goldH)" stroke="#8f5a0a" stroke-width=".6"/>

    <!-- Blade -->
    <use href="#blade" fill="url(#gold)" stroke="#8a5508" stroke-width="1.4"/>
    <!-- Beaded rim: dotted stroke on a slightly smaller copy -->
    <use href="#blade" transform="translate(0 -88) scale(.88) translate(0 88)" fill="none"
         stroke="#fff0b8" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="0 5.2"/>
    <use href="#blade" transform="translate(0 -88) scale(.88) translate(0 88)" fill="none"
         stroke="#8a5508" stroke-opacity=".35" stroke-width="3.4" stroke-linecap="round" stroke-dasharray="0 5.2" stroke-dashoffset="-.8"/>
    <!-- Engraved scrollwork -->
    <g fill="none" stroke="#9a6410" stroke-opacity=".55" stroke-width="1.2" stroke-linecap="round">
      <path d="M-20 -70 C-30 -86 -14 -102 -8 -92 C-4 -86 -12 -82 -16 -88"/>
      <path d="M20 -70 C30 -86 14 -102 8 -92 C4 -86 12 -82 16 -88"/>
      <path d="M-32 -62 C-36 -54 -24 -50 -22 -57"/>
      <path d="M32 -62 C36 -54 24 -50 22 -57"/>
      <path d="M0 -126 C-6 -118 -5 -110 0 -104 C5 -110 6 -118 0 -126"/>
      <path d="M-14 -112 C-20 -106 -18 -100 -12 -102"/>
      <path d="M14 -112 C20 -106 18 -100 12 -102"/>
    </g>
    <!-- Three raised bars with a ruby in the middle -->
    <g stroke="#8a5508" stroke-width=".8">
      <rect x="-22" y="-95" width="44" height="6" rx="3" fill="url(#goldV)"/>
      <rect x="-22" y="-86" width="44" height="6" rx="3" fill="url(#goldV)"/>
      <rect x="-22" y="-77" width="44" height="6" rx="3" fill="url(#goldV)"/>
    </g>
    <circle cx="0" cy="-83" r="6.6" fill="url(#goldV)" stroke="#8a5508" stroke-width=".8"/>
    <circle cx="0" cy="-83" r="4.6" fill="url(#ruby)"/>
    <ellipse cx="-1.4" cy="-84.6" rx="1.5" ry="1" fill="#fff" fill-opacity=".8"/>

    <!-- Lotus base: outer petals, side petals, centre petal -->
    <g stroke="#8a5508" stroke-width=".9" stroke-linejoin="round">
      <path d="M-44 -40 C-44 -26 -26 -14 0 -12 C26 -14 44 -26 44 -40 C30 -46 -30 -46 -44 -40 Z" fill="url(#gold)"/>
      <path d="M-42 -40 C-52 -52 -40 -64 -26 -54 C-22 -48 -24 -40 -30 -34 Z" fill="url(#gold)"/>
      <path d="M42 -40 C52 -52 40 -64 26 -54 C22 -48 24 -40 30 -34 Z" fill="url(#gold)"/>
      <path d="M-30 -36 C-38 -50 -22 -62 -12 -50 C-8 -44 -12 -34 -18 -28 Z" fill="url(#goldV)"/>
      <path d="M30 -36 C38 -50 22 -62 12 -50 C8 -44 12 -34 18 -28 Z" fill="url(#goldV)"/>
      <path d="M0 -62 C-14 -52 -16 -32 0 -16 C16 -32 14 -52 0 -62 Z" fill="url(#goldV)"/>
    </g>
    <path d="M0 -54 C-5 -44 -5 -32 0 -24" fill="none" stroke="#fff0b8" stroke-opacity=".75" stroke-width="1.2" stroke-linecap="round"/>
  </g>
</svg>
<script src="float.js"></script>
<script src="renderer.js"></script>
</body>
</html>
